name: Portfolio demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: portfolio-test
          POSTGRES_DB: portfolio
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: portfolio-test
      PGDATABASE: portfolio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_data.py
      - run: python scripts/build_summary.py
      - run: python scripts/check_summary.py
      - run: node --check demo/app.js
      - name: Execute schema, import and all analysis queries
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/schema.sql
          psql -v ON_ERROR_STOP=1 -c "\copy container_movements FROM 'demo/container_movements.csv' CSV HEADER"
          psql -v ON_ERROR_STOP=1 -f sql/queries.sql
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
      - name: Wait for the uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become visible within 60 seconds."
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
